[package]
name = "youtube-studio-agent"
version = "1.0.0"
description = "YouTube Studio Agent Desktop App"
authors = ["bedri"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
tauri = { version = "1.5", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# default to custom-protocol for production builds, use dev-path for development
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
